[project]
name = "voice-studio"
version = "0.1.0"
description = "Multi-tenant knowledge, commerce and voice-agent platform"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.34",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.8",
  "argon2-cffi>=23.1",
  "cryptography>=44",
  "httpx>=0.28",
  "beautifulsoup4>=4.13",
  "pypdf>=5",
  "python-docx>=1.1",
  "python-multipart>=0.0.20",
  "openai>=2.0",
  "fish-audio-sdk>=1.3",
  "websockets>=15",
  "msgpack>=1.1",
  "numpy>=2.2",
  "plivo>=4.58",
  "jsonschema>=4.23",
  "azure-storage-blob>=12.25",
  "azure-identity>=1.21",
  "soxr>=1.1.0",
  "twilio>=9.12.0",
  "httpcore>=1.0,<2",
  "PyJWT[crypto]>=2.10,<3",
  "playwright>=1.51",
  "redis>=6,<8",
  "pillow>=11,<13",
  "dnspython>=2.7,<3",
  "azure-keyvault-secrets>=4.10,<5",
  "email-validator>=2.2,<3",
  "sarvamai>=0.1.40",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25"]

[tool.pytest.ini_options]
pythonpath = ["services/control"]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["sandbox: real isolated parsing, rendering, audio or PDF integration (opt in with --run-sandbox; mandatory in CI)"]

[tool.uv]
package = false
